# CAST web nginx — serves the SPA, proxies /api, terminates TLS.
# Certs are bind-mounted read-only from the host /etc/letsencrypt (acme-dns
# DNS-01, mirroring Logistics Coordinator; self-signed interim). See
# knowledge/architecture/cast-web-app-deployment.md.

# Runtime DNS for the api service name so nginx starts even if api is briefly down.
resolver 127.0.0.11 valid=10s;

server {
  listen 80;
  server_name cast.tritontechnical.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name cast.tritontechnical.com;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate     /etc/letsencrypt/live/cast.tritontechnical.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cast.tritontechnical.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  # Baseline hardening headers (security review, INIT-0026 Phase 3) — none of
  # these change existing behavior for a same-origin SPA; they just close
  # off classes of attack (protocol downgrade, framing, MIME sniffing) that
  # cost nothing to block.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

  location /api/ {
    set $api http://api:3001;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # index.html must never cache so new asset fingerprints are picked up post-deploy.
  location = /index.html { add_header Cache-Control "no-store, no-cache, must-revalidate"; }
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; }
}

# Internal-only, plain HTTP, NOT published to the host (see docker-compose.yml —
# no `ports:` entry for 8080) — exists solely so the `api` container's Playwright
# render (pdf/render.ts, CAST_INTERNAL_WEB_URL) can reach this same SPA+API
# without hitting the 443 block's TLS cert (issued for the public hostname, not
# the internal Docker DNS name `web`) or the 80 block's https redirect, which
# would otherwise send that request straight into a certificate mismatch.
# Mirrors LogisticsCoordinator's own proven `nginx:8080` internal pattern.
server {
  listen 8080;
  server_name web;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    set $api http://api:3001;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location / { try_files $uri $uri/ /index.html; }
}
