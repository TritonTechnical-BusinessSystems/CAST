# CAST web app — deploy target: Docker on trt-cast-01
# (knowledge/architecture/cast-web-app-vm-provisioning.md + cast-web-app-deployment.md).
# Deploy from the repo root:  docker compose up -d --build
services:
  # Read-only view of the Docker daemon for System Health's container
  # inventory (INIT-0016) — cast-api talks to THIS, never the raw socket, so a
  # compromised API process can list containers but never control the daemon.
  # CONTAINERS (GET, list/inspect) and STATS (GET, per-container cpu/mem/io
  # counters — System Health's resource-usage charts, INIT-0016) are
  # allow-listed; everything else (POST/exec/etc.) is off by default. Never
  # published to the host — reachable only from `api` over the internal
  # bridge network.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: cast-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      STATS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: components/api/Dockerfile
    image: cast-api:latest
    container_name: cast-api
    restart: unless-stopped
    env_file: components/api/.env
    volumes:
      # Encrypted store + key on a host bind mount so backups read it directly
      # (scripts/backup.sh). Persists across redeploys.
      - /opt/cast/data:/app/components/api/.data
      # Read-only, System Health's backup-freshness probe (INIT-0016) — the
      # SAME dir `scripts/backup.sh` writes to. `api` never writes here, and
      # its unprivileged user (uid 10001) can't read a tarball's contents
      # (root-600), only its name/size/mtime via stat — see
      # health/backupFreshness.ts. (TLS expiry does NOT need a mount — see
      # health/certExpiry.ts / config.ts for why: certbot's archive dir is
      # root-only, so a file read would never actually work here; it's a
      # live TLS handshake to `web:443` instead.)
      - /opt/cast/backups:/opt/cast/backups:ro
    depends_on: [docker-proxy]
    networks: [internal, deploy]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: components/web/Dockerfile
    image: cast-web:latest
    container_name: cast-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # 8080 is nginx.conf's internal-only plain-HTTP listener (the `api`
    # container's Playwright PDF render reaches this SPA through it, see
    # config.ts's internalWebUrl) — deliberately NOT in `ports:` above, so
    # it's only reachable from other containers on the `internal` network,
    # never from the host/internet. `expose` is self-documentation only
    # (Compose's user-defined bridge already allows this without it).
    expose:
      - "8080"
    volumes:
      # Certs from the host (acme-dns DNS-01 / self-signed interim), read-only.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  # Deploy agent (INIT-0035) — the ONLY container holding the real Docker
  # socket + a git deploy key, so `api` (which decrypts every stored
  # credential) never needs either directly. Triggered by `api`'s System
  # Health "Redeploy" buttons over the internal network only — no `ports:`
  # entry, unreachable from the host/internet. Real Docker socket access is
  # host-root-equivalent by nature, and this container also needs read-write
  # access to the app tree (including components/api/.env) to drive a git
  # pull + rebuild — it is NOT a secrets-free or otherwise safe component if
  # compromised. What this design actually buys (security review, 2026-08-21,
  # correcting an earlier overclaim in this repo's own docs): `api`'s OWN
  # code/dependencies/request-handling — the only part of the credential-
  # holding process an outside attacker can actually reach — can never touch
  # Docker or the deploy key, only this agent's two fixed, authenticated
  # actions. On the dedicated `deploy` network (see below), not `internal` —
  # `web` (the only internet-facing container) has no network path to it at all.
  deploy-agent:
    build:
      context: .
      dockerfile: components/deploy-agent/Dockerfile
    image: cast-deploy-agent:latest
    container_name: cast-deploy-agent
    restart: unless-stopped
    # Same file `api` already reads (DEPLOY_AGENT_TOKEN lives here too) — NOT
    # compose-level `${DEPLOY_AGENT_TOKEN}` shell interpolation, which would
    # need a root `.env` in the compose project directory that doesn't exist
    # anywhere in this deploy's actual layout (caught in security review,
    # 2026-08-21 — the original version of this file silently could never
    # have received the token on the real host).
    env_file: components/api/.env
    environment:
      APP_DIR: /opt/cast/app
      DEPLOY_KEY_HOST_PATH: /home/tritonadmin/.ssh/cast-deploy-agent-key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Both mirror the HOST path exactly (not a container-relative path) —
      # dockerd runs on the host and resolves this compose project's own
      # relative bind mounts (e.g. api's /opt/cast/data) against the real
      # host filesystem, so `docker compose build/up` invoked from INSIDE
      # this container only works correctly if its own view of the app tree
      # (and the deploy key path referenced below) sits at the identical path
      # the host itself uses (standard Docker-outside-of-Docker mirroring).
      # The key is a plain bind mount, not Compose `secrets:` — a `secrets:`
      # file source is resolved by whichever `docker compose` CLI process is
      # running, which is THIS container when deploy.sh drives its own
      # redeploy, not the host; without an identical-path bind mount here
      # too, that resolution fails (caught in security review, 2026-08-21).
      - /opt/cast/app:/opt/cast/app
      - /home/tritonadmin/.ssh/cast-deploy-agent-key:/home/tritonadmin/.ssh/cast-deploy-agent-key:ro
    networks: [deploy]

networks:
  internal:
    driver: bridge
  # Separate from `internal` deliberately — only `api` and `deploy-agent` sit
  # on this one, so `web` (the only container reachable from the internet)
  # and `docker-proxy` have no network path to the agent at all, even though
  # its own auth token would still refuse them (security review, 2026-08-21).
  # NOT `internal: true` — deploy-agent needs real outbound internet access
  # on this network for `git fetch`/`pull` against GitHub.
  deploy:
    driver: bridge
